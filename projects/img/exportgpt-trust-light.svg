<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<!-- Костяк взят из рабочей схемы архитектуры проекта: DNS и Let's Encrypt как внешние
     участники, сервер — рамкой. Отличия публичной версии: без IP и без имени хоста.
     Версия TLS, шифр, издатель сертификата и отказ порта 3000 сняты живыми запросами. -->
<style>
  .name{font-size:15px;font-weight:700;fill:#14110E}
  .sub{font-size:12.5px;fill:#6B635A}
  .monoq{font-size:11px;fill:#6B635A;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .cap{font-size:11px;fill:#6B635A;letter-spacing:.1em;font-weight:600}
  .box{fill:none;stroke:#14110E;stroke-width:2.5}
  .soft{fill:#EFEAE0;stroke:#14110E;stroke-width:2.5}
  .ext{fill:none;stroke:#6B635A;stroke-width:2}
  .dash{stroke:#6B635A;stroke-width:1.8;stroke-dasharray:6 5;fill:none}
</style>
<rect fill="#F7F4EE" width="1200" height="620"/>

<!-- outside parties -->
<rect class="ext" x="40" y="40" width="200" height="70"/>
<text class="name" x="58" y="70">DNS</text>
<text class="sub" x="58" y="92">name → address</text>
<path class="dash" d="M140 112 V270"/>
<text class="sub" x="150" y="196">where to send it</text>

<rect class="ext" x="820" y="40" width="250" height="70"/>
<text class="name" x="838" y="70">Let's Encrypt</text>
<text class="sub" x="838" y="92">issues the certificate, free</text>
<path class="dash" d="M900 112 L790 250"/>

<!-- browser -->
<text class="cap" x="40" y="296">BROWSER</text>
<rect class="soft" x="40" y="312" width="200" height="150"/>
<text class="name" x="58" y="344">the extension</text>
<text class="sub" x="58" y="368">collects the turns,</text>
<text class="sub" x="58" y="386">rebuilds one HTML file</text>
<text class="sub" x="58" y="404">and packs the images</text>
<text class="sub" x="58" y="422">inside it</text>
<text class="monoq" x="58" y="446">base64 · index.html</text>

<path d="M248 378 H392" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text class="sub" x="252" y="356">encrypted the</text>
<text class="sub" x="252" y="374">whole way</text>
<text class="monoq" x="252" y="406">HTTP/2 · TLS 1.3</text>
<text class="monoq" x="252" y="422">AES-128-GCM</text>

<!-- server -->
<rect x="410" y="228" width="750" height="300" fill="none" stroke="#D93A00" stroke-width="2.5"/>
<text class="cap" x="430" y="258" fill="#D93A00">ONE RENTED SERVER · UBUNTU</text>

<rect class="box" x="430" y="282" width="180" height="140"/>
<text class="name" x="448" y="314">firewall</text>
<text class="sub" x="448" y="338">nothing but the</text>
<text class="sub" x="448" y="356">encrypted port is</text>
<text class="sub" x="448" y="374">reachable from</text>
<text class="sub" x="448" y="392">the internet</text>
<text class="monoq" x="448" y="412">443 only</text>

<path d="M618 352 H656" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

<rect class="box" x="664" y="282" width="210" height="140"/>
<text class="name" x="682" y="314">Caddy</text>
<text class="sub" x="682" y="338">decrypts the request</text>
<text class="sub" x="682" y="356">and keeps the</text>
<text class="sub" x="682" y="374">certificate valid on</text>
<text class="sub" x="682" y="392">its own</text>
<text class="monoq" x="682" y="412">systemd service</text>

<path d="M882 352 H920" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

<rect class="box" x="928" y="282" width="210" height="140"/>
<text class="name" x="946" y="314">Gotenberg</text>
<text class="sub" x="946" y="338">a browser without a</text>
<text class="sub" x="946" y="356">window opens the file</text>
<text class="sub" x="946" y="374">and saves it as PDF</text>
<text class="monoq" x="946" y="398">Docker · 120s cap</text>
<text class="monoq" x="946" y="414">restart after 10 jobs</text>

<text class="sub" x="430" y="460">Inside the server the request never touches the internet: the renderer answers only to</text>
<text class="sub" x="430" y="478">the machine itself, and from outside its port refuses to connect.</text>
<text class="monoq" x="430" y="502">127.0.0.1:3000</text>

<!-- back -->
<path d="M1033 430 V560 H248" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text class="sub" x="600" y="552">the finished PDF returns the same way</text>

<rect class="soft" x="40" y="530" width="200" height="70"/>
<text class="name" x="58" y="560">file on disk</text>
<text class="sub" x="58" y="582">saved by the browser</text>

<text class="sub" x="430" y="584">Checked with real requests: the TLS version, the cipher, who issued the certificate,</text>
<text class="sub" x="430" y="602">and that the renderer's port refuses connections from outside.</text>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#14110E"/>
  </marker>
</defs>
</svg>
