<div id="bar"><span id="knopki"><button id="bplay" title="Start or pause. The music is made right now by three musicians; nothing is recorded. Space does the same.">▶ play</button><button id="bnote" title="Leave a note on the music stand: one line, any language — a composer, a style, a mood, a song. A piece on their shelf — the Moonlight Sonata — comes as its score, note for note, or, if you ask for a jam on it, as its score left open on the stand: each reads its own part and chooses — as written, changed, answered, or silence; for anything else a language model writes a piece: a key, chords, a theme and motifs, how the hands and the bass go, a pulse (never the melody of an existing song). They finish the bar they are in and play it now: the score goes to the pianist, a sheet to the one it names or the one who likes it most. Under the field — a few ready ones to pick.">✎ note</button><button id="bplace" title="Where tonight — postcards of other times and places; from the next piece they play as they played there (the window does the same)">place</button><button id="bdrums" title="Rudy, a fourth musician: the place decides what he plays — the drums where there was a kit (he keeps the style's time, fills, trades fours), the clarinet in Vienna; in Buenos Aires and Leningrad he sings, without words. He hears, thinks in the pause and keeps a diary like the three. Click again — he leaves">+ Rudy</button><button id="bvox" title="Mae, a fifth musician: the place decides what she plays — she sings, without words, at home, on Central Avenue and in Vienna; the alto sax at The Haig, the trombone in New Orleans, the violin in Buenos Aires, the flute in Leningrad. She hears, thinks in the pause and keeps a diary like the three. Click again — she leaves">+ Mae</button><button id="bview" title="The view: the lab — lanes, the chronicle, the thoughts in words — or the doll house: the same music, the band as turned wooden dolls in the clothes of the place, in the room of tonight's place (for now Café Domínguez, Buenos Aires 1917). Nothing in the music changes. In volume since v31 (the knob «obem»)">view: lab</button><button id="bwords" title="AI — the language model. On: the musicians' thoughts in the pause, the reading of a guest's note (and looking for its notes on the web) and the words between pieces come from it — only while this page is open from the local server, under a ceiling an evening (thoughts 36, notes 10, words 6; what is spent shows under «lab ▸»). Off: plain rules do all of it. The playing is always by rules — who plays, when, how loud; with the AI on, a note's sheet, a new motif or a piece of their own may come from it. A line the AI said is marked ✦">AI: on</button><button id="blab" title="The developer's layer: switches for comparing — the inner voice, ears, where you listen from — what the AI spent this evening, and a next evening or a new band">lab ▸</button><span id="labk" style="display:none"><span id="aiuse" style="color:#9aa3b5;margin:0 4px" title="What the AI spent this evening against each ceiling: the minds' thoughts in the pauses, the notes it read, the words between pieces"></span><button id="bvoice" title="The inner voice: before each phrase each one hears what the others just did, feels, and chooses one move — answer, take up, build, breathe out, give room, recall the tune, risk, finish; its thought shows above its head. Off: as v20 — they choose beat by beat from their tables">voice: on</button><button id="bears" title="Ears on: they hear each other. Ears off is the control: nobody hears anybody and each keeps its own clock.">ears: on</button><button id="bceil" title="Where you listen from: in the room with them, or from the flat below — a ceiling lets through mostly the low notes.">listen: in the room</button><button id="bnext" title="The next evening: the same band — they keep their diaries, what they meant to try and how it went, and the book of what they found.">↻ next evening</button><button id="bnew" title="A new band: no diaries and no book — they start from nothing. Forgets what was kept between visits.">✦ new band</button></span><button id="bdev" title="The developer layer: the lab view and its line, the AI switch, the look of the house. Fold it away and the evening stays as a guest sees it — play, a note, the place, Rudy and Mae, the character, the house; unfold it again. The page remembers which.">dev ▾</button></span><span id="hint" title="A flat concert at night. Three musicians gather and play — and two more, if you call them. You sit on the sofa: leave a note on the stand, or look out of the window and pick where tonight is — another time and place: they hear you, but they are not yours to command.">A flat concert at night — leave a note, or look out of the window: they hear you, but they are not yours to command</span></div><div id="tips"></div><div id="sceny"></div><input id="note" maxlength="80" placeholder="a note for the music stand — Enter to leave it, Esc to cancel">
