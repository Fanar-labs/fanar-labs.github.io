<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>test v1</title>
<style>
html,body{margin:0;background:#1b1b1b;color:#ddd;font-family:monospace}
#w{width:700px;height:500px;position:relative}
canvas{display:block}
</style><script data-goatcounter="https://panarini.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<div id="w"><canvas id="c" width="700" height="500"></canvas></div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const COLS = 17, ROWS = 11, CS = 36, OX = 44, OY = 70;
const P = { start: 3, life: 14, vision: 2, wall: 0.22, chasm: 0.08, time: 90 };
let map, seen, me, face, blocks, score, t, beacons, nextPair, over, msg, msgT, taken, lost;

const FLOOR = 0, WALL = 1, CHASM = 2;

function reset() {
  map = []; seen = [];
  for (let y = 0; y < ROWS; y++) {
    map.push([]); seen.push([]);
    for (let x = 0; x < COLS; x++) {
      const r = Math.random();
      map[y].push(r < P.wall ? WALL : r < P.wall + P.chasm ? CHASM : FLOOR);
      seen[y].push(false);
    }
  }
  me = { x: 8, y: 5 }; face = { x: 1, y: 0 };
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) map[5 + dy][8 + dx] = FLOOR;
  blocks = P.start; score = 0; t = P.time; beacons = []; nextPair = 0.5;
  over = false; msg = ''; msgT = 0; taken = 0; lost = 0;
  reveal();
  window.IGRUSHKA.poslednyaya = null;
}

function reveal() {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (Math.abs(x - me.x) + Math.abs(y - me.y) <= P.vision) seen[y][x] = true;
}
function say(s) { msg = s; msgT = 2; }
function solid(x, y) { return x < 0 || y < 0 || x >= COLS || y >= ROWS || map[y][x] !== FLOOR; }

function spawnPair() {
  const cells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (map[y][x] === FLOOR && Math.abs(x - me.x) + Math.abs(y - me.y) >= 5) cells.push({ x, y });
  if (cells.length < 2) return;
  const a = cells.splice(Math.floor(Math.random() * cells.length), 1)[0];
  const far = cells.filter(c => Math.abs(c.x - a.x) + Math.abs(c.y - a.y) >= 4);
  const b = (far.length ? far : cells)[Math.floor(Math.random() * (far.length || cells.length))];
  beacons = [
    { ...a, col: '#6fa8dc', left: P.life },
    { ...b, col: '#e69138', left: P.life }
  ];
}

function act() {
  if (over) return;
  const x = me.x + face.x, y = me.y + face.y;
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  if (beacons.some(b => b.x === x && b.y === y)) return;
  const c = map[y][x];
  if (c === WALL) { map[y][x] = FLOOR; blocks++; }
  else if (blocks > 0) { map[y][x] = c === CHASM ? FLOOR : WALL; blocks--; }
  else say('No blocks. Break a wall to get one.');
  reveal();
}

function move(dx, dy) {
  if (over) return;
  face = { x: dx, y: dy };
  const x = me.x + dx, y = me.y + dy;
  if (!solid(x, y)) { me.x = x; me.y = y; reveal(); check(); }
}

function check() {
  const i = beacons.findIndex(b => b.x === me.x && b.y === me.y);
  if (i < 0) return;
  score++; taken++;
  say('Took the ' + (beacons[i].col === '#6fa8dc' ? 'blue' : 'orange') + ' gate. The other one is gone.');
  beacons = []; nextPair = 1;
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
  if (m) { move(m[0], m[1]); e.preventDefault(); }
  else if (k === ' ') { act(); e.preventDefault(); }
  else if (k === 'r') reset();
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!over) {
    t -= dt;
    if (msgT > 0) msgT -= dt;
    if (beacons.length) {
      beacons.forEach(b => b.left -= dt);
      if (beacons[0].left <= 0) { lost++; say('The gates faded before you got there.'); beacons = []; nextPair = 1.5; }
    } else {
      nextPair -= dt;
      if (nextPair <= 0) spawnPair();
    }
    if (t <= 0) {
      t = 0; over = true;
      window.IGRUSHKA.poslednyaya = { ishod: 'time_up', vremya: P.time, ochki: score, vzyato: taken, upusheno: lost };
    }
  }
  draw();
  requestAnimationFrame(loop);
}

function draw() {
  g.fillStyle = '#222'; g.fillRect(0, 0, 700, 500);
  g.fillStyle = '#ddd'; g.font = '13px monospace';
  g.fillText('Arrows/WASD: move · Space: break wall / build block / fill chasm · R: restart', 12, 20);
  g.fillText('Reach one gate. Taking one removes the other. Gates fade. Map is unknown — explore.', 12, 38);
  g.fillText('Score ' + score + '   Blocks ' + blocks + '   Time ' + Math.ceil(t), 12, 58);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const px = OX + x * CS, py = OY + y * CS;
    const vis = Math.abs(x - me.x) + Math.abs(y - me.y) <= P.vision;
    if (!seen[y][x]) { g.fillStyle = '#111'; g.fillRect(px, py, CS - 1, CS - 1); continue; }
    const c = map[y][x], d = vis ? 1 : 0.5;
    g.globalAlpha = d;
    g.fillStyle = c === WALL ? '#888' : c === CHASM ? '#000' : '#3a3a3a';
    g.fillRect(px, py, CS - 1, CS - 1);
    if (c === WALL) { g.strokeStyle = '#aaa'; g.strokeRect(px + 4, py + 4, CS - 9, CS - 9); }
    g.globalAlpha = 1;
  }
  const pulse = 1 + Math.sin(performance.now() / 200) * 0.1;
  beacons.forEach(b => {
    const px = OX + b.x * CS + CS / 2, py = OY + b.y * CS + CS / 2;
    g.strokeStyle = b.col; g.lineWidth = 3;
    g.beginPath(); g.arc(px, py, 12 * pulse, 0, 7); g.stroke();
    g.fillStyle = b.col; g.fillRect(px - 14, py + 15, 28 * Math.max(0, b.left / P.life), 3);
    g.lineWidth = 1;
  });
  const mx = OX + me.x * CS + CS / 2, my = OY + me.y * CS + CS / 2;
  g.fillStyle = '#fff'; g.beginPath(); g.arc(mx, my, 9, 0, 7); g.fill();
  g.fillStyle = '#f5d76e'; g.fillRect(mx + face.x * 14 - 3, my + face.y * 14 - 3, 6, 6);
  if (msgT > 0 && !over) { g.fillStyle = '#f5d76e'; g.fillText(msg, OX, OY + ROWS * CS + 20); }
  if (over) {
    g.fillStyle = 'rgba(0,0,0,.75)'; g.fillRect(150, 190, 400, 120);
    g.fillStyle = '#fff'; g.font = '20px monospace';
    g.fillText('Time up. Gates taken: ' + taken, 190, 238);
    g.font = '13px monospace';
    g.fillText('Faded: ' + lost + '.  Press R to play again.', 190, 270);
  }
}

window.IGRUSHKA = {
  ruchki: [
    { id: 'start', nazv: 'starting blocks', min: 0, max: 10, shag: 1, znach: P.start },
    { id: 'life', nazv: 'gate life, seconds', min: 4, max: 30, shag: 1, znach: P.life },
    { id: 'vision', nazv: 'sight radius', min: 1, max: 6, shag: 1, znach: P.vision },
    { id: 'wall', nazv: 'wall density', min: 0, max: 0.5, shag: 0.02, znach: P.wall },
    { id: 'chasm', nazv: 'chasm density', min: 0, max: 0.3, shag: 0.02, znach: P.chasm },
    { id: 'time', nazv: 'round length, seconds', min: 30, max: 180, shag: 10, znach: P.time }
  ],
  ustanovit(id, v) { P[id] = v; if (id === 'vision') reveal(); },
  sbros() { reset(); },
  poslednyaya: null
};
reset();
requestAnimationFrame(loop);
</script>
</body></html>
